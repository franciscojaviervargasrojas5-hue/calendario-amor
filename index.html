<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Amor ❤️ - Cuenta Regresiva</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <!-- Archivo de Estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Cada día más unidos ❤️</h1>
        <p class="subtitle">Un pequeño detalle para recordarte cuánto significas para mí y sanar cada pequeño desacuerdo con amor.</p>
    </header>

    <div class="calendar-grid" id="calendarGrid">
        <!-- Generado dinámicamente por JavaScript -->
    </div>

    <!-- Modal para mostrar la frase -->
    <div class="modal" id="messageModal">
        <div class="modal-content">
            <h2 id="modalTitle">Día 1</h2>
            <p id="modalMessage">Aquí irá la frase especial...</p>
            <button class="close-btn" onclick="closeModal()">Cerrar con un beso 💋</button>
        </div>
    </div>

    <footer>
        Hecho con todo mi corazón para ti.
    </footer>

    <!-- Script de la lógica -->
    <script src="script.js"></script>
</body>
</html>
